<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#ea580c">
  <meta name="description" content="Listen to The Next Listener  - sodanovels">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="sodanovels">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>sodanovels Audiobooks</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <!-- Hamburger menu (mobile, top left) -->
      <button class="sidebar-toggle-header" id="sidebarToggleHeader">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <h1 class="logo" id="headerTitle"><span class="italic">sodanovels</span></h1>

      <div class="header-actions">
        <button id="switchBookBtn" class="btn btn-secondary" style="display: none;">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span class="text">Switch Book</span>
        </button>
        <button id="installAppBtn" class="btn btn-secondary hidden">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="text">Install</span>
        </button>
        <button id="shareBtn" class="btn btn-ghost">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span class="text">Share</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Book Selector Modal -->
    <div id="bookSelector" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Select Audiobook</h2>
          <button class="modal-close" id="closeBookSelector">×</button>
        </div>
        <div class="modal-body">
          <div class="book-list" id="bookList"></div>
        </div>
      </div>
    </div>

    <!-- Chapter Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="closeSidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        Close
      </button>
      <div class="book-info">
        <h2 id="bookTitle">Loading...</h2>
        <p id="bookSubtitle"></p>
      </div>
      <nav class="chapter-list" id="chapterList">
        <!-- Chapters will be inserted here -->
      </nav>
    </aside>

    <!-- Reader Area -->
    <div class="reader">
      <div class="reader-content" id="readerContent">
        <h1 id="chapterTitle">Select a book to begin</h1>
        <div id="chapterText" class="chapter-text">
          <p>Welcome to <em>sodanovels</em> Audiobooks!</p>
          <p>Click "Switch Book" to choose between:</p>
          <ul>
            <li><strong>The Next Listener</strong> - A Voyager Mystery</li>
            <li><strong>The Three Dots</strong> - A Dime Store Mystery</li>
          </ul>
        </div>
      </div>

      <!-- Audio Controls -->
      <div class="audio-controls" id="audioControls">
        <audio id="audioPlayer" preload="metadata"></audio>

        <div class="controls-top">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-handle" id="progressHandle"></div>
          </div>
          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span class="separator">/</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls-bottom">
          <div class="controls-left">
            <button id="prevChapter" class="control-btn" title="Previous Chapter">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                <line x1="5" y1="19" x2="5" y2="5"></line>
              </svg>
            </button>
            <button id="skipBackward" class="control-btn" title="Skip Backward 10s">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 19 2 12 11 5 11 19"></polygon>
                <polygon points="22 19 13 12 22 5 22 19"></polygon>
              </svg>
              <span class="skip-label">-10</span>
            </button>
          </div>

          <button id="playPause" class="control-btn play-btn">
            <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <line x1="10" y1="4" x2="10" y2="20"></line>
              <line x1="14" y1="4" x2="14" y2="20"></line>
            </svg>
          </button>

          <div class="controls-right">
            <button id="skipForward" class="control-btn" title="Skip Forward 10s">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 19 22 12 13 5 13 19"></polygon>
                <polygon points="2 19 11 12 2 5 2 19"></polygon>
              </svg>
              <span class="skip-label">+10</span>
            </button>
            <button id="nextChapter" class="control-btn" title="Next Chapter">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <line x1="19" y1="5" x2="19" y2="19"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="controls-extra">
          <div class="playback-rate">
            <label for="playbackRate">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              Speed:
            </label>
            <select id="playbackRate">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="1.75">1.75x</option>
              <option value="2">2.0x</option>
            </select>
          </div>
          <div class="chapter-info">
            <span id="chapterProgress">Chapter 1 of 1</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Share Message -->
  <div id="shareMessage" class="toast hidden">
    Link copied to clipboard!
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="player.js"></script>

  <!-- PWA Registration -->
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration.scope);

            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available, prompt user to refresh
                  if (confirm('New version available! Reload to update?')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }

    // Log if running as PWA
    window.addEventListener('load', () => {
      if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running as PWA');
        // Request persistent storage for better reliability
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().then((persistent) => {
            console.log('Persistent storage:', persistent);
          });
        }
      }
    });
  </script>
</body>

</html>
